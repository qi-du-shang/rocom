name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/fonts
          cp index.html styles.css app.js api-config.js _site/
          cp map.html map.css map.js _site/
          cp calendar.html calendar.css calendar.js _site/
          cp rune.html rune.css rune.js _site/
          cp pet-viewer.html pet-viewer.css pet-viewer.js _site/
          cp fonts/RUNEREGULAR.ttf _site/fonts/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
